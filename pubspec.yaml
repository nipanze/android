name: nipanze
description: Non-custodial peer-to-peer loan listing marketplace for Uganda and emerging economies.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Connectivity
  connectivity_plus: ^7.1.0

  # Supabase
  supabase_flutter: ^2.5.0
  http: ^1.2.0

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # Navigation
  go_router: ^17.1.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.4.2

  # Code Generation (models)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Secure Storage
  flutter_secure_storage: ^10.0.0

  # Forms
  reactive_forms: ^18.1.0

  # UI / Animations
  animate_do: ^4.2.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^2.0.1

  # Charts
  fl_chart: ^1.2.0

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Local cache (UI layer only)
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  shared_preferences: ^2.3.2
  mime: ^2.0.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  injectable_generator: ^2.2.4
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    # Inter — body text, labels, forms, data tables
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

    # Sora — headings, screen titles, hero numbers
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700