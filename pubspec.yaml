name: opencapital
description: A non-custodial peer-to-peer lending marketplace for Uganda.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase — auth, database, realtime, storage
  supabase_flutter: ^2.5.0

  # State management
  flutter_bloc: ^8.1.6

  # Navigation
  go_router: ^14.2.7

  # Dependency injection
  get_it: ^8.0.2
  injectable: ^2.5.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Forms
  reactive_forms: ^18.2.2

  # Animations
  animate_do: ^3.3.4
  lottie: ^3.1.3

  # UI helpers
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.4.1

  # Charts (Stage 3 — analytics)
  fl_chart: ^0.69.0

  # UI cache only — not the primary database
  hive_flutter: ^1.1.0

  # PDF generation (Stage 3)
  pdf: ^3.11.0
  printing: ^5.13.2
  flutter_pdfview: ^1.3.2

  # Biometrics (Stage 3)
  local_auth: ^2.3.0

  # Notifications (Stage 3)
  flutter_local_notifications: ^17.2.4

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  injectable_generator: ^2.12.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600